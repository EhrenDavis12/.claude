# animate-characters config. Lives beside assetgen.yaml in the calling project.
# Every key under reference/video/mask/sheet has a default (see scripts/animate.py
# DEFAULTS); write only what you change.

# Where the Asset-Gen-Framework CLI is, relative to this file.
agf: ../Asset-Gen-Framework/.venv/bin/agf

# The style bible: prefixed to every character prompt. The character after
# "The character:" changes; nothing here does. Keep the background flat and
# a single light colour -- the matte and the outline restoration depend on it.
style: >-
  Clean 2D game character art. Chibi proportions with a large head and a compact
  body, flat cel shading with two tones per color and no gradients, thick uniform
  dark-charcoal outlines, a vibrant but limited palette. Full body, standing in a
  relaxed idle pose, facing three-quarter toward the viewer's right, feet planted
  and fully visible, centered in the frame with even margins. Solid flat light-gray
  background (#D9D9D9), nothing else in the scene: no floor, no shadow, no props on
  the ground, no text.

# The first character is generated from text alone and becomes the style
# reference every later character is generated against. Name another with
# style_anchor: <id> once you have one you love.

video:
  frames: 81        # Wan 2.2 refuses fewer
  fps: 16
  trim_end: 6       # the last frames brighten toward the last-frame image; dropped
  keep_every: 2     # every second frame -> 38 frames, played at 16 fps = 2.4 s

sheet:
  frame: 256
  columns: 7
  rows: 6

# Effects (a character's `skill:` below). Every key has a default in
# DEFAULTS["effect"]: the effect style bible, the "draw only this effect" prefix,
# the in-place video prompt and the burst prompt. `burst_fps` is the playback
# rate written to the catalog for the impact sheet, so a burst plays fast.
effect:
  burst_fps: 32
  matte: true       # the framework's effect matte: colour-keyed outside the mask body
                    # (the mask loses small shards), exact background dropped inside it

# Actions become buttons in the app, in this order. `idle` must loop. An action
# may set `fps:` to be played faster or slower than it was generated. The names
# skill, burst and reference are reserved.
actions:
  idle:
    loop: true
    motion: >-
      The character stands in place breathing calmly, a gentle subtle idle sway,
      weight shifting slightly, and ends in exactly the starting pose so the clip
      loops.
  attack: {}
  defend: {}
  hurt: {}

# One entry per character. `look` finishes the style bible's sentence; each
# action key holds what the character does, finishing "The character briskly ...".
#
# `skill:` gives the character a projectile effect drawn in its own style (its
# reference image is the init image): a looping sheet of the effect animating in
# place -- the app supplies the travel -- and a burst sheet of it shattering to
# nothing. The `look` must describe one solid opaque object with the same thick
# outline and no glow, transparency, blur or particles: the matte cannot carry
# half-transparency, and anything see-through comes back as a white blob.
# `noun` names it in the burst prompt; `burst:` replaces that prompt's motion.
# A thrown weapon should not be asked to spin: the video model turns it slowly,
# off-centre and short of a full turn. Give it a subtle in-place motion and set
# `spin: true`; the app rotates the sprite in flight, perfectly and forever.
characters:
  - id: knight
    name: Knight
    look: >-
      A knight in polished blue-and-silver plate armor with a red plume on the
      helmet, visor up showing a determined face, holding a longsword down at the
      right side and a kite shield on the left arm.
    attack: swings the longsword in one big overhead-to-diagonal slash
    defend: raises the kite shield up front and braces behind it
    hurt: >-
      recoils half a step backward as if struck, the shield arm jolting and the
      plume whipping, then straightens back up, staying in place
    skill:
      name: Sword Wave
      noun: crescent slash wave
      look: >-
        A single large crescent-shaped slash wave of solid pale-blue energy with a
        white inner band, shaped like a bold C opening toward the viewer's right,
        chunky and thick with no thin lines, solid opaque flat colours in two tones,
        the same thick dark-charcoal outline, no glow, no transparency, no motion
        blur, no particles, no character or figure, centered and filling about two
        thirds of the frame, on a solid flat light-gray background (#D9D9D9),
        nothing else.
      motion: >-
        the crescent pulses slightly larger and smaller and its white inner band
        ripples along its length

# For approve.py: where the Flutter app keeps sheets and the catalog.
app:
  assets: assets/characters
  catalog: assets/characters/characters.json
  pubspec: pubspec.yaml
