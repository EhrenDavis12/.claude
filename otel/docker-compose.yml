# The "look at my agents" stack. Four small containers:
#   otel-collector  receives telemetry from Claude Code (OTLP on 4317/4318)
#   agent-exporter  serves per-agent run history by NAME (see below)
#   prometheus      stores the numbers            (UI on http://localhost:9090)
#   grafana         draws the pictures            (UI on http://localhost:3000)
#
# Why agent-exporter exists: Claude Code reports every custom subagent as
# agent_name="custom", so its own telemetry can tell you a subagent ran but never
# which one. The names live only in ../metrics/agent-runs.jsonl, kept current by the
# SubagentStop hook. The exporter serves that file so per-agent panels can exist.
#
# Start:  cd .claude/otel && docker compose up -d
# Stop:   cd .claude/otel && docker compose down
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC  <- Claude Code sends here
      - "4318:4318"   # OTLP HTTP  (alternative)
      - "8889:8889"   # Prometheus scrape endpoint (collector -> prometheus)

  agent-exporter:
    image: python:3.12-alpine
    command: ["python", "-u", "/app/agent_exporter.py"]
    environment:
      - METRICS_FILE=/data/agent-runs.jsonl
      - PORT=9101
      - AGENTS_DIR=/agents
      - PRICES_FILE=/prices.json
    volumes:
      - ./agent_exporter.py:/app/agent_exporter.py:ro
      # The run log the SubagentStop hook writes. Read-only: nothing in this stack
      # may edit the history it is reporting on.
      - ../metrics:/data:ro
      # Agent definitions — read only for the `model:` line in each frontmatter,
      # so moving an agent between tiers re-prices it with no edit here.
      - ../agents:/agents:ro
      - ./model-prices.json:/prices.json:ro
    ports:
      - "9101:9101"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - agent-exporter

  grafana:
    image: grafana/grafana:latest
    environment:
      # No login needed — just open the page and you're an admin.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
