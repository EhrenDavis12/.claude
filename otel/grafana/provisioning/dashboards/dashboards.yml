# Auto-loads any dashboard JSON dropped in /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: "Claude Code Agents"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
